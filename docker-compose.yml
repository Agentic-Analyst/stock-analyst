# Run the agent locally from source: docker compose run --rm stock-analyst \
#   --pipeline chat --email you@example.com --timestamp 20260101_120000 \
#   --user-prompt "Analyze NVDA"
services:
  stock-analyst:
    build:
      context: .
      target: production
    image: stock-analyst:local
    env_file: .env
    volumes:
      - ./data:/data
